# ============================================================
# theme.conf - configure the kitsune//ai-mangr ui, kitty-style
#
#   key value        one per line, # starts a comment
#   edit + save + refresh the browser - that's it, live reload
#
# every key is optional - anything you leave out keeps the
# default. unknown keys are ignored. values are plain css
# colors (#hex, rgb(...), names) or css sizes (14px, 50%).
# ============================================================

# ---- main colors ----
#background            #0f1216        # app background
#foreground            #e6e8eb        # text color
#accent                #ff9042        # send button, links, highlights (fox orange)
#accent_text           #16100a        # text ON the accent color
#danger                #e06c75        # ollama-down dot, delete button
#dim                   #8b93a1        # secondary text, hints
#line                  #262d38        # borders

# ---- surfaces ----
#panel                 #161b22        # sidebar, topbar, bot bubbles
#panel2                #1c222b        # inputs, hover states
#user_bubble           #242c37        # your message bubbles
#scrollbar             #2a323e

# ---- type + shape ----
#font                  ui-sans-serif, sans-serif
#font_size             15px
#radius                14px           # bubble corner rounding

# ============================================================
# ready-made presets - delete the leading # of every line in
# the block you want (they must ALL be uncommented together)
# ============================================================

