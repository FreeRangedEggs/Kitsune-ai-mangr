# ============================================================
# settings.conf - app switches for kitsune//ai-mangr
#
#   key value        one per line, # starts a comment
#   the gear button in the sidebar writes this file -
#   hand edits work exactly the same, no restart needed
# ============================================================

# only one model in ram at a time: before each reply, every other
# loaded model is unloaded (keep_alive 0) so your chat bot and a
# coder brain never share the 8gb. off = ollama may keep two warm.
single_model on
